# Builds the app (no Python needed to run it) on Windows, macOS and Linux and attaches
# it to a GitHub release when the release is published. PyInstaller doesn't
# cross-compile, so each system builds its own.
name: release

on:
  release:
    types: [published]
  workflow_dispatch:  # a test build: the files are kept as the run's artifacts only

permissions:
  contents: write  # upload files to the release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: macos-latest
            name: macos-arm64
          - os: ubuntu-22.04  # the oldest glibc still built on: runs on more distributions
            name: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Linux packages (Qt and OpenCV runtimes)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1 libegl1 libglib2.0-0 libxkbcommon0 libfontconfig1 libdbus-1-3 libxcb-cursor0
      - run: pip install -e ".[build]"
      - run: pyinstaller packaging/cepxico.spec --noconfirm

      - name: Package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ "${{ github.event_name }}" = release ] || version=dev
          file="CEPxico-${version}-${{ matrix.name }}"
          case "${{ runner.os }}" in
            Windows) (cd dist && 7z a -tzip "../$file.zip" cepxico >/dev/null); echo "FILE=$file.zip" >> "$GITHUB_ENV" ;;
            macOS) ditto -c -k --keepParent dist/CEPxico.app "$file.zip"; echo "FILE=$file.zip" >> "$GITHUB_ENV" ;;
            Linux) tar -czf "$file.tar.gz" -C dist cepxico; echo "FILE=$file.tar.gz" >> "$GITHUB_ENV" ;;
          esac

      - name: Smoke test (the command line starts)
        shell: bash
        run: |
          if [ "${{ runner.os }}" = Windows ]; then dist/cepxico/cepxico.exe --help; else dist/cepxico/cepxico --help; fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ env.FILE }}
          retention-days: 7

      - name: Attach to the release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "$FILE" --clobber
