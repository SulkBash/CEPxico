# Bank reference data that Banxico's CEP catalog doesn't provide.
#
# KEYS are 3-digit CLABE bank codes: the first 3 digits of a CLABE and the last 3
# digits of Banxico's participant code (BBVA: CLABE 012..., Banxico code 40012).
# They survive renames and re-licensing, unlike names or full codes:
#   90638 "NU MEXICO" (SOFIPO)  ->  40638 "NUBANK" (bank, 2026)
#
# NAMES. Banxico's catalog for the payment date already supplies each bank's short
# name (e.g. "BBVA BANCOMER" before 2022, "BBVA MEXICO" after), and it is always
# matched. List here only the other ways a receipt may write the bank:
#   legal_name          razón social; its part before the first comma / " S.A." is
#                       matched too ("Banco Mercantil del Norte")
#   aliases             brands, former names, common spellings
#   ambiguous_names     names that are also ordinary words or appear on unrelated
#                       receipts (footers, merchants). Still used for labelled fields
#                       ("Banco destino: ..."), never when scanning a whole receipt.
#
# CLUES for identifying the *sending* bank when the receipt has no sender label:
#   tracking_key_prefixes   claves de rastreo this bank generates start with these
#   receipt_signatures      wording that appears only on this bank's own receipts
# Only add clues confirmed on real receipts, with a note saying so.
#
# SOURCES
#   Short names: https://www.banxico.org.mx/cep/instituciones.do, catalogs sampled
#     2015-07 .. 2026-11 (142 codes over time, 97 current, 23 renamed).
#   Legal names: Banxico, "Participantes directos en el SPEI", updated 2026-09-23:
#     https://www.banxico.org.mx/servicios/d/%7BC24C7DBC-9ABF-6F41-DA38-561CEB1401B3%7D.pdf

