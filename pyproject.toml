[build-system]
requires = ["setuptools>=77"]  # 77: SPDX license expressions
build-backend = "setuptools.build_meta"

[project]
name = "cepxico"
version = "2.1.0"
description = "Extracts SPEI transfer data from receipts and downloads the matching CEP from Banxico."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.23",  # PDF text, and rendering scanned PDFs for OCR
    "pillow>=10.0",
    "rapidocr>=3.10,<4",  # OCR for scans and screenshots; ONNX Runtime, models bundled
    "requests>=2.31",
    "PySide6-Essentials>=6.8",  # the desktop app (Qt Widgets); LGPL
]

[project.optional-dependencies]
# The v1 OCR engine, kept for comparison (CEPXICO_OCR=easyocr). Large: pulls in PyTorch.
easyocr = ["easyocr>=1.7"]
dev = ["pytest>=8.0", "ruff>=0.6"]
build = ["pyinstaller>=6.10"]

[project.scripts]
cepxico = "cepxico.cli:main"

[project.gui-scripts]
cepxico-gui = "cepxico.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cepxico = ["data/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
